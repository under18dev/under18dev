<!doctype html>
<html lang="ja">

    <!-- Basic -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Title -->
    <title>U18 Dev | Under18 Developers</title>

    <!-- SEO -->
    <meta
      name="description"
      content="U18 Dev（Under18 Developers）は、18歳以下の開発者・技術者の挑戦機会を創り出す技術組織です。学び、作り、発信し、挑戦できる場所を目指しています。"
    />

      name="keywords"
      content="U18 Dev,Under18 Developers,若手開発者,技術コミュニティ,LT会,OSS,YouTube,プログラミング"
    />
    <meta name="author" content="U18 Dev" />

      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="application-name" content="U18 Dev" />
    <meta name="apple-mobile-web-app-title" content="U18 Dev" />

    <!-- Canonical & locale -->
    <link rel="canonical" href="https://u18.dev/" />
    <link rel="alternate" hreflang="ja" href="https://u18.dev/" />
    <link rel="alternate" hreflang="x-default" href="https://u18.dev/" />

    <!-- Discovery -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

      property="og:description"

    <meta property="og:image:height" content="630" />

      property="og:image:alt"
      content="U18 Dev（Under18 Developers）— 次世代の開発者のための技術組織"
    />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->

      name="twitter:description"
      content="18歳以下の開発者・技術者が、もっと挑戦できる場所へ。"
    />

      name="twitter:image:alt"

    />

    <meta name="twitter:creator" content="@under18dev" />

    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.fontshare.com" />

    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=geist-sans@400,500,600,700&display=swap"
